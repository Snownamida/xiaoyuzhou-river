<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小宇宙 · 收听史</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#16181c;--dim:#8a8f98;--line:#e8eaee;--accent:#3eb575;--chip:#eceef2}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1114;--card:#171a1f;--fg:#e9ebef;--dim:#8b929c;--line:#242830;--chip:#1e2228}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
  .top{display:flex;align-items:baseline;gap:10px}
  h1{font-size:19px;margin:0}
  .status{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
  .bar{display:flex;gap:8px;padding:8px 14px}
  input[type=search]{flex:1;background:var(--chip);border:0;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--fg)}
  .btn{border:0;background:var(--chip);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px}
  main{padding:0 10px}
  h2{font-size:12px;color:var(--dim);font-weight:600;margin:16px 4px 6px;letter-spacing:.05em}
  .row{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:9px;margin-bottom:8px;text-decoration:none;color:inherit}
  .row img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--chip);flex:0 0 auto}
  .info{min-width:0;flex:1}
  .title{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--dim);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar2{height:3px;background:var(--chip);border-radius:2px;margin-top:6px;overflow:hidden}
  .bar2 i{display:block;height:100%;background:var(--accent)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  @media (min-width:760px){body{max-width:820px;margin:0 auto}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>收听史</h1>
    <span class="status" id="status">加载中…</span>
  </div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜单集 / 播客">
  <button class="btn" id="sync">同步</button>
</div>
<main id="list"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = [];

const fmtDur = s => { s = s || 0; const m = Math.floor(s/60), h = Math.floor(m/60);
  return h ? `${h}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}` : `${m}:${String(s%60).padStart(2,"0")}`; };
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dayLabel = ts => {
  const d = new Date(ts), n = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day(n) - day(d)) / 86400000;
  if (diff <= 0) return "今天";
  if (diff === 1) return "昨天";
  return `${d.getMonth()+1} 月 ${d.getDate()} 日`;
};

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const rows = data.filter(x => !q || (x.title||"").toLowerCase().includes(q) || (x.podcast||"").toLowerCase().includes(q));
  if (!rows.length){ $("#list").innerHTML = `<div class="empty">没有记录</div>`; return; }
  let html = "", last = "";
  for (const x of rows){
    const ts = x.played_at || x.pub_date;
    const k = ts ? dayKey(ts) : "unknown";
    if (k !== last){ html += `<h2>${ts ? dayLabel(ts) : "更早"}</h2>`; last = k; }
    const pct = x.duration ? Math.min(100, Math.round((x.progress||0) * 100 / x.duration)) : 0;
    html += `<a class="row" href="https://www.xiaoyuzhoufm.com/episode/${esc(x.eid)}" target="_blank" rel="noopener">
      <img src="${esc(x.ep_image || x.pod_image || "")}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="title">${esc(x.title || "(未知单集)")}</div>
        <div class="meta">${esc(x.podcast || "")} · ${fmtDur(x.duration)} · 已听 ${pct}%</div>
        <div class="bar2"><i style="width:${pct}%"></i></div>
      </div>
    </a>`;
  }
  $("#list").innerHTML = html;
}

async function load(){
  const r = await fetch("/api/history?limit=500");
  data = (await r.json()).items || [];
  const s = await (await fetch("/api/stats")).json();
  const run = s.run;
  $("#status").textContent = run
    ? `${Math.max(0, Math.round((Date.now()/1000 - run.ts)/60))} 分钟前同步 · ${s.plays} 条`
    : `${s.plays} 条`;
  render();
}

$("#q").oninput = render;
$("#sync").onclick = async () => {
  $("#sync").textContent = "同步中…";
  await fetch("/api/sync", {method:"POST"});
  for (let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,3000)); const s = await (await fetch("/api/stats")).json(); if (s.run && Date.now()/1000 - s.run.ts < 60) break; }
  $("#sync").textContent = "同步";
  load();
};
load();
</script>
</body>
</html>
